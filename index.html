<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive weather dashboard with live weather data and no API key required.">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <form class="search" role="search" onsubmit="return false;">
      <label class="sr-only" for="cityInput">City name</label>
      <input id="cityInput" type="search" placeholder="Enter a city" autocomplete="off" spellcheck="false">
      <button type="button" aria-label="Search weather"><img src="search.png" alt=""></button>
    </form>

    <p class="error" role="alert">City not found</p>

    <section class="weather" aria-live="polite">
      <img src="rain.png" class="weather-icon" alt="Weather condition">
      <p class="condition">Current conditions</p>
      <h1 class="temp">--°C</h1>
      <h2 class="city">Loading...</h2>
      <div class="details">
        <div class="col">
          <img src="humidity.png" alt="">
          <div><p class="humidity">--%</p><p>Humidity</p></div>
        </div>
        <div class="col">
          <img src="wind.png" alt="">
          <div><p class="wind">-- km/h</p><p>Wind speed</p></div>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
